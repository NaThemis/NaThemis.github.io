site_name: NathalieDecode
nav:
  - Home: index.md
  - About Me: about.md
  - CV: cv.md
site_description: A site sharing articles, discoveries and reflexions around legal, data and AI.
site_url: https://nathemis.github.io/
theme:
  logo: assets/images/nathaliedecode.png
  font:
    text: Jost
    code: JetBrains Mono
  custom_dir: overrides
  name: material
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: black
      accent: white
    
    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: white
      accent: black



plugins: 
  - search
  - blog:
      blog_dir: .
      archives_date_format: yyyy 
      archives_url_date_format: yyyy
      categories_allowed:
        - AI
        - Data Platforms
        - Cyber
      post_url_format: '{slug}'
  - tags:
      tags_file: tags.md
  - rss:
      match_path: "posts/.*"
      pretty_print: true
      date_from_meta:
          as_creation: date.created
          as_update: date.updated
  - git-committers:
      enabled: true
      repository: NaThemis/NaThemis.github.io
      branch: main
      token: !ENV GH_TOKEN
  - git-revision-date-localized:
      exclude:
        - docs/cv.md
        - docs/about.md
        - docs/index.md
        - docs/tags.md
      enabled: true
      type: date
      fallback_to_build_date: true
      enable_creation_date: true


extra:
  social:
    # - icon: simple/youtube
    #   link: https://www.youtube.com/@shannax
    - icon: simple/github
      link: https://github.com/nathemis
    # - icon: simple/x
    #   link: https://x.com/TheRealShannax
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/nathalie-fouet/
  homepage: https://nathemis.github.io

hooks:
  - hooks/socialmedia.py
  - hooks/rag_indexer.py
  - hooks/copy_admin.py

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheet/custom.css
  - assets/stylesheets/chatbot.css

extra_javascript:
  - https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js
  - https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js
  - https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js
  - https://cdn.jsdelivr.net/npm/chart.js
  - scripts/firebase-config.js
  - scripts/tracker.js
  - assets/javascripts/chatbot.js